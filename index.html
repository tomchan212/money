<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>✈️ 日本旅遊記帳 🇯🇵</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>✈️ 日本旅遊記帳 🇯🇵</h1>
    <p class="subtitle">雙幣別自動算賬與預算追蹤 💴 💵</p>
    <p class="sync-status syncing" id="sync-status">☁️ 連線試算表中…</p>
  </header>

  <main class="app-container">
    <!-- Loading / Toast -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>同步中…</p>
    </div>

    <!-- Tab: 記一筆賬 (Home) -->
    <div id="tab-form" class="tab-panel active" role="tabpanel" aria-label="記一筆賬">
      <section class="card form-card">
        <div class="home-spent-bar">
          <div class="home-spent-header">
            <div class="home-spent-title">💸 目前已花</div>
            <div class="currency-selector" aria-label="幣別篩選">
              <button type="button" class="currency-label badge-jpy active" data-currency-view="jpy" aria-pressed="true">💴 JPY</button>
              <button type="button" class="currency-label badge-hkd" data-currency-view="hkd" aria-pressed="false">💵 HKD</button>
              <button type="button" class="currency-label badge-all" data-currency-view="all" aria-pressed="false">💱 全部</button>
            </div>
          </div>
          <div class="home-spent-currency" data-currency-panel="jpy">
            <div class="home-spent-row">
              <div class="home-spent-item">
                <span class="person-emoji" aria-label="A">👦🏻</span>
                <span class="stat-spent">已花 <strong class="spent-value" data-person="a" data-currency="jpy">0</strong></span>
              </div>
              <div class="home-spent-item">
                <span class="person-emoji" aria-label="B">👩🏻</span>
                <span class="stat-spent">已花 <strong class="spent-value" data-person="b" data-currency="jpy">0</strong></span>
              </div>
            </div>
          </div>
          <div class="home-spent-currency hidden" data-currency-panel="hkd">
            <div class="home-spent-row">
              <div class="home-spent-item">
                <span class="person-emoji" aria-label="A">👦🏻</span>
                <span class="stat-spent">已花 <strong class="spent-value" data-person="a" data-currency="hkd">0</strong></span>
              </div>
              <div class="home-spent-item">
                <span class="person-emoji" aria-label="B">👩🏻</span>
                <span class="stat-spent">已花 <strong class="spent-value" data-person="b" data-currency="hkd">0</strong></span>
              </div>
            </div>
          </div>
        </div>

        <h2>➕ 記一筆賬</h2>
        <form id="expense-form" novalidate>
        <div class="form-row">
          <label for="expense-date">📅 日期</label>
          <input type="date" id="expense-date" name="date" required>
        </div>

        <div class="form-row">
          <label for="expense-category">🏷️ 分類</label>
          <select id="expense-category" name="category" required>
            <optgroup label="🍱 餐飲">
              <option value="餐飲-早餐">🌅 早餐</option>
              <option value="餐飲-午餐" selected>☀️ 午餐</option>
              <option value="餐飲-晚餐">🌙 晚餐</option>
            </optgroup>
            <option value="交通">🚗 交通</option>
            <option value="住宿">🏨 住宿</option>
            <option value="購物">🛍️ 購物</option>
            <option value="景點">🎟️ 景點</option>
            <option value="便利店">🏪 便利店</option>
            <option value="雜項">📦 雜項</option>
            <option value="__custom__">✏️ 自定</option>
          </select>
        </div>

        <div class="form-row custom-category-row hidden" id="expense-custom-category-row">
          <label for="expense-custom-category">✏️ 自定分類名稱</label>
          <input type="text" id="expense-custom-category" placeholder="例：溫泉、門票">
        </div>

        <div class="form-row">
          <label for="expense-description">📝 項目描述 <span class="label-optional">（選填）</span></label>
          <input type="text" id="expense-description" name="description" placeholder="例：叙叙苑燒肉、Suica 增值">
        </div>

        <div class="form-row">
          <label>💱 幣別</label>
          <div class="toggle-group" id="currency-toggle">
            <button type="button" class="toggle-btn active" data-currency="JPY">JPY 💴</button>
            <button type="button" class="toggle-btn" data-currency="HKD">HKD 💵</button>
          </div>
          <input type="hidden" id="expense-currency" name="currency" value="JPY">
        </div>

        <div class="form-row">
          <label for="expense-amount">💰 金額</label>
          <div class="money-input-wrap">
            <span class="money-prefix" id="expense-amount-prefix">¥</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="expense-amount" name="amount" placeholder="0" required>
          </div>
        </div>

        <div class="form-row">
          <label>💳 邊個畀錢</label>
          <div class="toggle-group" id="payer-toggle">
            <button type="button" class="toggle-btn person-btn active" data-payer="A" aria-label="A 付款">👦🏻</button>
            <button type="button" class="toggle-btn person-btn" data-payer="B" aria-label="B 付款">👩🏻</button>
          </div>
          <input type="hidden" id="expense-payer" name="payer" value="A">
        </div>

        <div class="form-row">
          <label>💸 樣嘢點計</label>
          <div class="split-options" id="split-options">
            <label class="split-option">
              <input type="radio" name="split_mode" value="SPLIT_5050" checked>
              <span><span class="split-emoji-lg" aria-hidden="true">👥</span> 一人一半</span>
            </label>
            <label class="split-option">
              <input type="radio" name="split_mode" value="FOR_A">
              <span><span class="split-emoji-lg" aria-hidden="true">👦🏻</span> 自己嘅</span>
            </label>
            <label class="split-option">
              <input type="radio" name="split_mode" value="FOR_B">
              <span><span class="split-emoji-lg" aria-hidden="true">👩🏻</span> 自己嘅</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">新增消費明細 ✨</button>
      </form>
      </section>
    </div>

    <!-- Tab: 預算與花費總覽 -->
    <div id="tab-summary" class="tab-panel" role="tabpanel" aria-label="預算與花費總覽">
      <section class="card summary-card">
        <div class="section-header">
          <h2>💰 預算與花費總覽</h2>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-edit-budget">✏️ 改預算</button>
        </div>

        <div class="currency-selector summary-currency-selector" aria-label="幣別篩選">
          <button type="button" class="currency-label badge-jpy active" data-currency-view="jpy" aria-pressed="true">💴 JPY</button>
          <button type="button" class="currency-label badge-hkd" data-currency-view="hkd" aria-pressed="false">💵 HKD</button>
          <button type="button" class="currency-label badge-all" data-currency-view="all" aria-pressed="false">💱 全部</button>
        </div>

        <div class="summary-stats" data-currency-panel="jpy">
          <div class="stat-chip">
            <span class="person-emoji" aria-label="A">👦🏻</span>
            <div class="stat-chip-body">
              <div class="stat-spent">已花 <strong class="spent-value" data-person="a" data-currency="jpy">0</strong></div>
              <div class="stat-remain remain-value" data-person="a" data-currency="jpy">剩餘 0</div>
            </div>
          </div>
          <div class="stat-chip">
            <span class="person-emoji" aria-label="B">👩🏻</span>
            <div class="stat-chip-body">
              <div class="stat-spent">已花 <strong class="spent-value" data-person="b" data-currency="jpy">0</strong></div>
              <div class="stat-remain remain-value" data-person="b" data-currency="jpy">剩餘 0</div>
            </div>
          </div>
        </div>

        <div class="summary-stats hidden" data-currency-panel="hkd">
          <div class="stat-chip">
            <span class="person-emoji" aria-label="A">👦🏻</span>
            <div class="stat-chip-body">
              <div class="stat-spent">已花 <strong class="spent-value" data-person="a" data-currency="hkd">0</strong></div>
              <div class="stat-remain remain-value" data-person="a" data-currency="hkd">剩餘 0</div>
            </div>
          </div>
          <div class="stat-chip">
            <span class="person-emoji" aria-label="B">👩🏻</span>
            <div class="stat-chip-body">
              <div class="stat-spent">已花 <strong class="spent-value" data-person="b" data-currency="hkd">0</strong></div>
              <div class="stat-remain remain-value" data-person="b" data-currency="hkd">剩餘 0</div>
            </div>
          </div>
        </div>

        <div class="settlement-card" id="settlement-card">
          <div class="settlement-title">🤝 淨債務結算</div>
          <div id="settlement-jpy" class="settlement-line" data-currency-panel="jpy">—</div>
          <div id="settlement-hkd" class="settlement-line hidden" data-currency-panel="hkd">—</div>
          <div class="settlement-actions hidden" id="settlement-actions">
            <button type="button" class="btn btn-primary btn-sm btn-block" id="btn-open-repay">🤝 記錄還錢</button>
          </div>
          <div class="help-pay-block">
            <div class="help-pay-title">🤲 代付一覽</div>
            <div id="help-pay-jpy" class="help-pay-line">—</div>
            <div id="help-pay-hkd" class="help-pay-line">—</div>
          </div>
        </div>

        <details class="settlement-explain-details" id="settlement-explain-details">
          <summary class="settlement-explain-summary">
            <span class="settlement-explain-summary-label">📊 結算計算過程</span>
            <span class="explain-preview" id="settlement-explain-preview"></span>
          </summary>
          <div class="settlement-explain-inner">
            <div id="settlement-explain-jpy" class="settlement-explain" data-currency-panel="jpy"></div>
            <div id="settlement-explain-hkd" class="settlement-explain hidden" data-currency-panel="hkd"></div>
          </div>
        </details>
      </section>
    </div>

    <!-- Tab: 明細紀錄 -->
    <div id="tab-list" class="tab-panel" role="tabpanel" aria-label="明細紀錄">
      <section class="card list-card">
      <div class="section-header">
        <h2>📄 明細紀錄</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh">🔄 刷新</button>
      </div>

      <div class="list-controls">
        <div class="filter-grid">
          <div class="filter-item filter-item-full">
            <label for="filter-day">📅 選擇日子</label>
            <div class="filter-day-row">
              <input type="date" id="filter-day" aria-label="篩選日期">
              <button type="button" class="btn btn-ghost btn-sm" id="filter-day-clear">全部日子</button>
            </div>
          </div>
          <div class="filter-item">
            <label for="filter-sort-amount">💰 價錢</label>
            <select id="filter-sort-amount">
              <option value="">預設</option>
              <option value="asc">低至高 ↑</option>
              <option value="desc">高至低 ↓</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="filter-sort-date">🕐 排序</label>
            <select id="filter-sort-date">
              <option value="desc">最新優先</option>
              <option value="asc">最舊優先</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="filter-category">🏷️ 分類</label>
            <select id="filter-category">
              <option value="">全部分類</option>
              <option value="餐飲">🍱 餐飲（全部）</option>
              <option value="餐飲-早餐">🌅 早餐</option>
              <option value="餐飲-午餐">☀️ 午餐</option>
              <option value="餐飲-晚餐">🌙 晚餐</option>
              <option value="交通">🚗 交通</option>
              <option value="住宿">🏨 住宿</option>
              <option value="購物">🛍️ 購物</option>
              <option value="景點">🎟️ 景點</option>
              <option value="便利店">🏪 便利店</option>
              <option value="雜項">📦 雜項</option>
              <option value="還錢">🤝 還錢</option>
              <option value="__custom__">✏️ 自定</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="filter-split">💸 樣嘢點計</label>
            <select id="filter-split">
              <option value="">全部</option>
              <option value="SPLIT_5050">👥 一人一半</option>
              <option value="FOR_A">👦🏻 自己嘅</option>
              <option value="FOR_B">👩🏻 自己嘅</option>
              <option value="REPAY">🤝 還錢</option>
            </select>
          </div>
        </div>

        <div class="pagination-bar">
          <div class="filter-item page-size-item">
            <label for="filter-page-size">每頁顯示</label>
            <select id="filter-page-size">
              <option value="10">10 筆</option>
              <option value="20">20 筆</option>
              <option value="50">50 筆</option>
              <option value="all">全部</option>
            </select>
          </div>
          <div class="pagination-info" id="pagination-info">共 0 筆</div>
          <div class="pagination-nav" id="pagination-nav">
            <button type="button" class="btn-page" id="btn-prev" disabled aria-label="上一頁">‹</button>
            <div class="page-numbers" id="page-numbers"></div>
            <button type="button" class="btn-page" id="btn-next" disabled aria-label="下一頁">›</button>
          </div>
        </div>
      </div>

      <ul id="transaction-list" class="transaction-list">
        <li class="empty-state">載入中…</li>
      </ul>
      </section>
    </div>
  </main>

  <nav class="tab-nav" role="tablist" aria-label="主選單">
    <button type="button" class="tab-btn" data-tab="summary" role="tab" aria-selected="false" aria-controls="tab-summary">
      <span class="tab-icon">💰</span>
      <span>總覽</span>
    </button>
    <button type="button" class="tab-btn active" data-tab="form" role="tab" aria-selected="true" aria-controls="tab-form">
      <span class="tab-icon">➕</span>
      <span>記賬</span>
    </button>
    <button type="button" class="tab-btn" data-tab="list" role="tab" aria-selected="false" aria-controls="tab-list">
      <span class="tab-icon">📄</span>
      <span>明細</span>
    </button>
  </nav>

  <!-- Repay Modal -->
  <div id="repay-modal" class="modal hidden" role="dialog" aria-labelledby="repay-modal-title" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="repay-modal-title">🤝 記錄還錢</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="關閉">&times;</button>
      </div>
      <form id="repay-form">
        <p class="repay-context" id="repay-context">—</p>
        <input type="hidden" id="repay-payer" value="">
        <div class="form-row">
          <label>💱 幣別</label>
          <div class="toggle-group" id="repay-currency-toggle">
            <button type="button" class="toggle-btn active" data-currency="JPY">💴 JPY</button>
            <button type="button" class="toggle-btn" data-currency="HKD">💵 HKD</button>
          </div>
          <input type="hidden" id="repay-currency" value="JPY">
        </div>
        <div class="form-row">
          <label for="repay-amount">💰 還錢金額</label>
          <div class="money-input-wrap">
            <span class="money-prefix" id="repay-amount-prefix">¥</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="repay-amount" required>
          </div>
        </div>
        <div class="form-row">
          <label for="repay-note">📝 備註 <span class="label-optional">（選填）</span></label>
          <input type="text" id="repay-note" placeholder="例：現金、PayMe">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="repay-submit-btn">確認還錢 ✅</button>
      </form>
    </div>
  </div>

  <!-- Budget Modal -->
  <div id="budget-modal" class="modal hidden" role="dialog" aria-labelledby="budget-modal-title" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="budget-modal-title">✏️ 修改初始預算</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="關閉">&times;</button>
      </div>
      <form id="budget-form">
        <div class="budget-grid">
          <div class="budget-person">
            <h4><span class="person-emoji-inline" aria-label="A">👦🏻</span></h4>
            <label>JPY 預算
              <div class="money-input-wrap">
                <span class="money-prefix">¥</span>
                <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="budget-a-jpy" required>
              </div>
            </label>
            <label>HKD 預算
              <div class="money-input-wrap">
                <span class="money-prefix">$</span>
                <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="budget-a-hkd" required>
              </div>
            </label>
          </div>
          <div class="budget-person">
            <h4><span class="person-emoji-inline" aria-label="B">👩🏻</span></h4>
            <label>JPY 預算
              <div class="money-input-wrap">
                <span class="money-prefix">¥</span>
                <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="budget-b-jpy" required>
              </div>
            </label>
            <label>HKD 預算
              <div class="money-input-wrap">
                <span class="money-prefix">$</span>
                <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="budget-b-hkd" required>
              </div>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">儲存預算 💾</button>
      </form>
    </div>
  </div>

  <!-- Edit Transaction Modal -->
  <div id="edit-modal" class="modal hidden" role="dialog" aria-labelledby="edit-modal-title" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="edit-modal-title">✏️ 編輯消費明細</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="關閉">&times;</button>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-transaction-id">
        <input type="hidden" id="edit-transaction-key">
        <div class="form-row">
          <label for="edit-date">📅 日期</label>
          <input type="date" id="edit-date" required>
        </div>
        <div class="form-row">
          <label for="edit-category">🏷️ 分類</label>
          <select id="edit-category" required>
            <optgroup label="🍱 餐飲">
              <option value="餐飲">🍱 餐飲（其他）</option>
              <option value="餐飲-早餐">🌅 早餐</option>
              <option value="餐飲-午餐">☀️ 午餐</option>
              <option value="餐飲-晚餐">🌙 晚餐</option>
            </optgroup>
            <option value="交通">🚗 交通</option>
            <option value="住宿">🏨 住宿</option>
            <option value="購物">🛍️ 購物</option>
            <option value="景點">🎟️ 景點</option>
            <option value="便利店">🏪 便利店</option>
            <option value="雜項">📦 雜項</option>
            <option value="__custom__">✏️ 自定</option>
          </select>
        </div>

        <div class="form-row custom-category-row hidden" id="edit-custom-category-row">
          <label for="edit-custom-category">✏️ 自定分類名稱</label>
          <input type="text" id="edit-custom-category" placeholder="例：溫泉、門票">
        </div>

        <div class="form-row">
          <label for="edit-description">📝 項目描述 <span class="label-optional">（選填）</span></label>
          <input type="text" id="edit-description">
        </div>
        <div class="form-row">
          <label>💱 幣別</label>
          <div class="toggle-group" id="edit-currency-toggle">
            <button type="button" class="toggle-btn active" data-currency="JPY">JPY 💴</button>
            <button type="button" class="toggle-btn" data-currency="HKD">HKD 💵</button>
          </div>
          <input type="hidden" id="edit-currency" value="JPY">
        </div>
        <div class="form-row">
          <label for="edit-amount">💰 金額</label>
          <div class="money-input-wrap">
            <span class="money-prefix" id="edit-amount-prefix">¥</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="money-input" id="edit-amount" required>
          </div>
        </div>
        <div class="form-row" id="edit-payer-row">
          <label>💳 邊個畀錢</label>
          <div class="toggle-group" id="edit-payer-toggle">
            <button type="button" class="toggle-btn person-btn active" data-payer="A" aria-label="A 付款">👦🏻</button>
            <button type="button" class="toggle-btn person-btn" data-payer="B" aria-label="B 付款">👩🏻</button>
          </div>
          <input type="hidden" id="edit-payer" value="A">
        </div>
        <div class="form-row" id="edit-split-row">
          <label>💸 樣嘢點計</label>
          <div class="split-options" id="edit-split-options">
            <label class="split-option">
              <input type="radio" name="edit_split_mode" value="SPLIT_5050">
              <span><span class="split-emoji-lg" aria-hidden="true">👥</span> 一人一半</span>
            </label>
            <label class="split-option">
              <input type="radio" name="edit_split_mode" value="FOR_A">
              <span><span class="split-emoji-lg" aria-hidden="true">👦🏻</span> 自己嘅</span>
            </label>
            <label class="split-option">
              <input type="radio" name="edit_split_mode" value="FOR_B">
              <span><span class="split-emoji-lg" aria-hidden="true">👩🏻</span> 自己嘅</span>
            </label>
          </div>
        </div>
        <div class="edit-form-actions">
          <button type="button" class="btn btn-danger" id="edit-delete-btn">🗑️ 刪除紀錄</button>
          <button type="submit" class="btn btn-primary">儲存修改 💾</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Transaction Detail Modal -->
  <div id="detail-modal" class="modal hidden" role="dialog" aria-labelledby="detail-modal-title" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content modal-content-detail">
      <div class="modal-header">
        <h3 id="detail-modal-title">📋 紀錄詳情</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="關閉">&times;</button>
      </div>
      <div id="detail-modal-body" class="detail-body"></div>
      <button type="button" class="btn btn-primary btn-block" id="detail-edit-btn">✏️ 編輯此紀錄</button>
    </div>
  </div>

  <script src="app.js?v=20260726b"></script>
</body>
</html>
